services:
  postgres:
    image: postgres:17
    container_name: nessiye-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: nessiye
      POSTGRES_USER: amir
      POSTGRES_PASSWORD: amirkunie1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: nessiye-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
